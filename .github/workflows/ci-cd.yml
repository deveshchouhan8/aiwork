name: Next.js CI/CD with Vercel

on:
  push:
    branches: [ main, master ] # Jab aap code push karenge tab ye chalega

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub se code lena
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js setup karna
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Packages install karna
      - name: Install Dependencies
        run: npm ci

      # 4. Code check aur build karna
      - name: Build Next.js Project
        run: npm run build

      # 5. Vercel par final deploy karna (Jo secrets aapne dale the, wo yahan use honge)
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          vercel-args: '--prod'
